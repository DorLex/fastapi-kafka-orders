name: "fastapi-kafka"

services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    #    env_file:
    #      - .env
    #    volumes:
    #      - ../logs/orders_app:/project/logs
    ports:
      - "8000:8000"
    #    depends_on:
    #      - postgres
    #      - kafka
    #    entrypoint: [ "docker/wait-for-it.sh", "${KAFKA_HOST}:${KAFKA_PORT}", "--" ]
    command: "uvicorn src.app.main:app --host 0.0.0.0 --port 8000"



  #  order_worker:
  # TODO: использовать app-image
  #    build:
  #      context: ../
  #      dockerfile: docker/Dockerfile
  #    env_file:
  #      - .env
  ##    volumes:
  ##      - ../logs/order_worker:/project/logs
  #    depends_on:
  #      - postgres
  #      - kafka
  #    entrypoint: [ "docker/wait-for-it.sh", "${KAFKA_HOST}:${KAFKA_PORT}", "--" ]
  #    command: "python -m src.run_consumer"

  postgres:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    ports:
      #- "9092:9092" # кажется, ненужен
      - "9094:9094"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ] # проверка внутри контейнера
      interval: 10s # интервал между двумя проверками (default: 30s)
      timeout: 5s # если test превышает указанное время, классифицируется как неудача (default: 30s)
      start_period: 5s # время, при котором test не будет тратить retries (default: 0s)
      retries: 5 # повторные попытки (по умолчанию - 3)

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8080:8080"
#    depends_on:
#      kafka:
#        condition: service_healthy # ждем, пока у kafka отработает healthcheck


volumes:
  postgres_data:
